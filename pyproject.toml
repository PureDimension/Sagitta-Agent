[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagitta-agent"
version = "0.1.0"
description = "A lightweight planner for durable asynchronous development work."
requires-python = ">=3.11"

[project.scripts]
sagitta = "sagitta.cli:main"

[tool.setuptools.package-data]
sagitta = ["prompts/*.md", "schemas/*.json"]
