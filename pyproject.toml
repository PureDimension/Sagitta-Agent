[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagitta-agent"
version = "0.1.0"
description = "A lightweight planner for durable asynchronous development work."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "pydantic-ai-slim[openai]>=2.29,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
sagitta = "sagitta.cli:main"
sagitta-web = "sagitta.web:main"

[tool.setuptools.package-data]
sagitta = ["prompts/*.md", "schemas/*.json", "web/static/*"]
